; ============================================================
; Engineering-Watch ファームウェア (LilyGO T-Watch S3)
; Arduino framework + LVGL 8.3 + ESP32 BLE
; ============================================================
[platformio]
default_envs = twatch_s3

[env:twatch_s3]
; 公式 (TTGO_TWatch_Library t-watch-s3) と同じ環境に固定
; espressif32 6.3.0 = Arduinoコア 2.0.x (TFT_eSPI 2.5.43 はコア3.x非対応のため)
platform = espressif32@6.3.0
board = twatch_s3
framework = arduino

; 16MB flash / 8MB OPI PSRAM / FFat partition
board_build.partitions = partitions.csv

build_flags =
    ; PSRAM 有効化 (TWatch ライブラリの必須条件)
    -DBOARD_HAS_PSRAM
    ; USB CDC をブート時から有効化 (シリアルログをUSB経由で確認可能)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI: T-Watch S3 (Setup212_LilyGo_T_Watch_S3.h 相当) ---
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GFXFF
    -DSMOOTH_FONT

; TWatchライブラリの library.json が固定版を自動取得する:
;   lvgl 8.4.0 / TFT_eSPI 2.5.43 / RadioLib 7.1.0 / XPowersLib 0.2.4 / SensorLib 0.1.8
; そのため明示的な依存は ArduinoJson のみ (バージョン重複防止)
lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#t-watch-s3
    bblanchon/ArduinoJson@^7.0.0

monitor_speed = 115200
upload_speed = 921600
